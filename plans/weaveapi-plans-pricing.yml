refunds:
  policy_url: https://weaveapi.dev/refund/
  summary: >-
    Prepaid credits. Duplicate or incorrect charges are investigated; missing credits from a completed
    recharge are reconciled on request; credits already consumed for delivered usage are generally not
    refundable unless required by law or a confirmed billing error.

