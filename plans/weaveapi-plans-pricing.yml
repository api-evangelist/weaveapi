model: prepaid-credits
currency: USD
plan_count: 2

summary: >-
  WeaveAPI sells one product — a prepaid credit balance spent across every supported model route — and
  publishes no per-seat or per-month subscription tier. The public pricing page describes two paths:
  self-serve "Pay as you go" and a "Account review" path for larger accounts that is a contact-support
  motion, not a priced tier. Neither path publishes a dollar rate on the public site; the docs, the
  pricing page and the models page all defer to the console Model Marketplace as the source of truth.
  That marketplace, however, has an UNAUTHENTICATED public projection at /api/pricing, which returns
  the full callable model list with its price ratios — captured verbatim in weaveapi-model-pricing.json.

plans:
  - name: Pay as you go
    id: pay-as-you-go
    price: null
    price_note: >-
      No fixed price. Prepaid credits are purchased in the console and drawn down per request; the
      rate depends on the model route selected. No published minimum top-up on the public site.
    currency: USD
    billing_period: prepaid
    self_serve: true
    highlighted: true
    included:
      - One shared account balance across all supported model routes
      - API keys and usage logs in console
      - Model rates shown in the live Model Marketplace
      - No separate provider dashboard required for WeaveAPI usage
      - New accounts include a $1 signup testing credit
    limits:
      rate_limits: Standard account limits (no numbers published)
      api_access: OpenAI-compatible /v1
      api_keys: Console managed
      usage_logs: Available in console
      support: Standard support handoff
    best_for: Testing, prototypes, apps

  - name: Account review
    id: account-review
    price: null
    price_note: Contact support. Not a priced tier — a review motion for larger usage.
    currency: USD
    billing_period: prepaid
    self_serve: false
    contact: support@weaveapi.dev
    included:
      - Everything in pay as you go
      - Account-limit review
      - Support handoff for operational questions
      - Usage planning discussion
      - Manual review for larger accounts
    limits:
      rate_limits: Account review required
      model_pricing: Marketplace plus account review
    best_for: Larger production workloads

