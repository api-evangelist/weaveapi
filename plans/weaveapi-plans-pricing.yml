  amount: 1
  currency: USD
  note: New accounts include a $1 signup testing credit.

# Probed verbatim from the unauthenticated gateway config at /api/status
billing_configuration:
  method: probed
  source: https://api.weaveapi.dev/api/status
  quota_display_type: USD
  quota_per_unit: 500000
  display_in_currency: true
  price: 7.3
  stripe_unit_price: 8
  usd_exchange_rate: 7.3
  note: >-
    These are the gateway's own top-up/exchange settings as served publicly. `quota_per_unit` (500000)
    is the internal quota units per one display unit; `price` / `usd_exchange_rate` (7.3) and
    `stripe_unit_price` (8) are the top-up conversion settings. Payment is taken via Stripe.
  payment_processor: Stripe

# Price ratios, not dollar amounts — recorded exactly as the provider serves them.
pricing_model:
  scheme: ratio
  note: >-
    WeaveAPI runs the open-source New API gateway (confirmed by the x-new-api-version and
    x-oneapi-request-id response headers), which prices per model with a `model_ratio` multiplier for
    input tokens, a `completion_ratio` multiplier applied on top for output tokens, and a `cache_ratio`
    for cached input. NO DOLLAR FIGURE PER MODEL IS PUBLISHED ANYWHERE PUBLIC, and this artifact does
    not compute one — converting a ratio to a rate requires the gateway's base-rate constant, which
    WeaveAPI does not publish. The ratios below are recorded verbatim so the relative cost of routes is
    at least comparable.
  quota_type_0_means: token-metered (as opposed to per-call fixed price)
  groups:
    default: Default group
    vip: VIP group
  group_ratio:
    default: 1
    vip: 1
  group_note: >-
    A VIP group exists and is selectable, but its multiplier is 1 — identical to default. No model in
    the public catalog is restricted to it; every route lists enable_groups [default].

