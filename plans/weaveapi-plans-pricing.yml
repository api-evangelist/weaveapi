      and DeepSeek (vendor 2) in the vendor table — but the public callable catalog contains ZERO
      Anthropic routes and ZERO DeepSeek routes. Five of the seven advertised families are callable;
      two are not, at least not to an unauthenticated reader.
    caveat: >-
      This is the UNAUTHENTICATED projection of the catalog. WeaveAPI's docs state that the console and
      the authenticated /v1/models response are the source of truth and that access is account-specific,
      so an authenticated account may see routes this probe cannot. Recorded as an observed gap between
      the public marketing claim and the public catalog, not as a claim about what any account can call.
    also: >-
      All 19 routes declare supported_endpoint_types ["openai"] only. None declares "anthropic", even
      though the gateway exposes a live Anthropic-compatible POST /v1/messages route (401 unauthenticated)
      and the docs publish a Claude Code setup guide against it.
