format: openai-error-envelope
rfc9457: false
rfc9457_note: >-
  WeaveAPI does NOT use RFC 9457 problem+json. It returns the OpenAI-style error envelope, which is the
  correct choice for an OpenAI-wire-compatible gateway — an existing OpenAI SDK parses it without
  modification. Recorded as a deliberate compatibility decision, not a defect.

envelope:
  content_type: application/json; charset=utf-8
  shape: |
    {
      "error": {
        "message": "human-readable description",
        "type": "error class",
        "param": "offending parameter, may be empty",
        "code": "machine code, may be empty"
      }
    }
  fields:
    - field: error.message
      always_present: true
      note: >-
        Carries the request id inline in parentheses on gateway-generated errors, e.g.
        "Invalid token (request id: 202608112040025861429178268d9d6T5viNnDh)". This duplicates the
        x-oneapi-request-id response header.
    - field: error.type
      always_present: true
      observed_values: [new_api_error, invalid_request_error]
    - field: error.param
      always_present: false
      note: Observed empty on every probed error.
    - field: error.code
      always_present: false
      note: >-
        Observed EMPTY on every probed error. This is the single biggest error-semantics gap — the
        machine-readable field an agent would branch on carries no value, leaving string-matching on
        error.message as the only way to distinguish failure modes.
  correlation:
    header: x-oneapi-request-id
    also_in_body: true
    documented: >-
      The docs and support page both instruct developers to include "request id if visible" when
      contacting support.

# Observed live against the running gateway, unauthenticated.
observed_errors:
  method: probed
  fetched: '2026-08-11'
  errors:
    - status: 401
      type: new_api_error
      code: ''
      message: 'Invalid token (request id: …)'
      trigger: Missing or invalid Authorization bearer token on any /v1 route.
      observed_on:
        - GET /v1/models
        - POST /v1/chat/completions
        - POST /v1/responses
        - POST /v1/messages
      remediation: >-
        Confirm the Authorization header is "Bearer YOUR_WEAVEAPI_KEY" and that the key is active in
        Console → Token Management.
      note: Returned identically for an absent header and for a wrong key.
    - status: 404
      type: invalid_request_error
      code: ''
      message: 'Invalid URL (GET /v1/nonexistent)'
      trigger: Request to a path the gateway does not route.
      observed_on:
        - GET /v1/nonexistent
        - POST /v1/batches
        - POST /v1/messages/count_tokens
      remediation: Check the endpoint path and that the route is supported by the gateway.
      note: >-
        Echoes the method and path back in the message. Unlike the 401, this response is cacheable
        (cache-control max-age=604800).
    - status: 401
      type: null
      code: null
      message: 'Unauthorized, not logged in and no access token provided'
      envelope: '{"message": "...", "success": false}'
      trigger: Console/admin API routes (/api/*) called without a session.
      observed_on:
