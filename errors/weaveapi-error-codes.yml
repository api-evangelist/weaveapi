# The docs' own failure-mode table. Prose, not codes.
documented_failure_modes:
  source: https://weaveapi.dev/docs/
  note: >-
    WeaveAPI publishes a troubleshooting table rather than an error-code reference. It maps seven issue
    types to causes and checks, but ties none of them to an HTTP status or an error code.
  modes:
    - issue: Authentication issue
      means: The request may be missing a valid WeaveAPI key.
      check: Confirm the Authorization header uses Bearer YOUR_WEAVEAPI_KEY and the key is active.
      maps_to_status: 401
    - issue: Wrong base URL
      means: The SDK or HTTP client may be pointed at the wrong API host.
      check: Use https://api.weaveapi.dev/v1 as the base URL.
      maps_to_status: 404
    - issue: Model ID not available
      means: The selected model route may not be available for your account.
      check: Confirm the model ID in the live Model Marketplace or authenticated /v1/models response.
      maps_to_status: null
    - issue: Insufficient balance
      means: Your prepaid balance may not cover the request.
      check: Check balance, recent usage, and top-up status in the Console.
      maps_to_status: null
    - issue: Route temporarily unavailable
      means: The selected route may be unavailable or capacity-limited for a short period.
      check: Try again later and confirm whether another available route fits your use case.
      maps_to_status: null
    - issue: Upstream provider issue
      means: The upstream model provider may be returning an error or degraded response.
      check: Retry later and compare with another available route when appropriate.
      maps_to_status: null
    - issue: SDK configuration issue
      means: The client library may not be using the expected base URL, key, endpoint, or request shape.
      check: Check base URL, Authorization header, endpoint path, and model ID placeholder replacement.
      maps_to_status: null
  escalation:
    contact: support@weaveapi.dev
    include: [request time, model ID, endpoint path, full error message, request id if visible]
    do_not_send: [API keys]

gaps:
  - error.code is empty on every observed error — no machine-branchable code.
  - No published error-code reference; only a prose troubleshooting table.
  - Four of seven documented failure modes map to no stated HTTP status.
  - Two incompatible error envelopes on one host (/v1 vs /api).
  - Untranslated upstream Chinese error strings reachable on a public endpoint.
  - No documented retry/backoff guidance and no Retry-After on any observed response.

