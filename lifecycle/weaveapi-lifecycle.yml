    last_updated: '2026-06'
  privacy_policy:
    url: https://weaveapi.dev/privacy/
    last_updated: '2026-06'
  abuse_policy:
    url: https://weaveapi.dev/abuse/
    last_updated: '2026-06'
  refund_policy:
    url: https://weaveapi.dev/refund/

data_handling:
  source: https://weaveapi.dev/privacy/
  prompts_routed_upstream: true
  prompt_content_sold: false
  statement: >-
    "Prompts and responses may be routed to upstream model providers to fulfill requests. WeaveAPI does
    not sell prompt content." Provider handling varies by route; WeaveAPI does not enumerate which
    upstream handles which route, so a consumer cannot determine where a given prompt is processed.
  retention: >-
    "We retain operational records for metering, security, support, billing reconciliation, and
    compliance needs, then reduce or remove records when they are no longer needed." No retention period
    is stated.
  logged: [account email, API key metadata, usage logs, billing and top-up records, request metadata, error logs, support messages]

