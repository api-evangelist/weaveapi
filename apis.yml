apis:
  - name: WeaveAPI OpenAI-compatible API
    description: >-
      OpenAI-wire-compatible REST API for chat completions, responses-style requests and the model
      catalog, authenticated with a bearer API key in the Authorization header. Three endpoints are
      documented (POST /v1/chat/completions, POST /v1/responses, GET /v1/models); probing shows a
      further dozen OpenAI-style routes registered on the gateway but undocumented. No OpenAPI is
      published, so request and response schemas are inherited from the OpenAI wire format rather than
      specified by WeaveAPI.
    humanURL: https://weaveapi.dev/docs/
    baseURL: https://api.weaveapi.dev/v1
    tags:
