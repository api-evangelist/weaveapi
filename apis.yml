image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/weaveapi.png
name: WeaveAPI - OpenAI-compatible AI API Gateway
description: >-
  WeaveAPI is a hosted, OpenAI-wire-compatible inference gateway: one base URL
  (https://api.weaveapi.dev/v1) and one bearer API key give access to model routes drawn from several
  upstream families, while keys, prepaid balance, usage logs and top-ups are managed in a hosted
  console. The pitch is drop-in substitution — keep an existing OpenAI SDK, change the base URL and the
  key, and pick a model id from the console Model Marketplace. It also exposes an Anthropic-compatible
  messages route, and publishes setup guides for Claude Code, Codex, OpenCode, OpenClaw, Claude Desktop
  and Hermes via CC Switch. Billing is prepaid credits shared across every route, metered per model,
  with a $1 signup testing credit and no subscription tiers. The gateway runs the open-source New API
  platform. WeaveAPI publishes no OpenAPI or other machine-readable contract, no SDK of its own, no MCP
  server, no status page and no changelog.
