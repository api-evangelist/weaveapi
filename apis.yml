  - name: WeaveAPI Anthropic-compatible Messages API
    description: >-
      Anthropic/Claude-wire-compatible messages route served from the bare api.weaveapi.dev host. The
      Claude Code setup guide instructs clients to use the host WITHOUT /v1 because Claude-compatible
      clients build the messages path themselves; the route resolves at POST /v1/messages and is
      confirmed live and auth-gated. Uses the same WeaveAPI bearer key. No model in the public catalog
      declares Anthropic endpoint support, so which routes answer here is not publicly verifiable.
    humanURL: https://weaveapi.dev/docs/claude-code-cc-switch/
