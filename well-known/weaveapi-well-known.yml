note: >-
  Every RFC 8615 /.well-known/ path was probed on all three WeaveAPI hosts and NOT ONE returned a real
  document. The marketing host (weaveapi.dev) and the API host (api.weaveapi.dev) return honest 404s.
  The console host (console.weaveapi.dev) is a single-page application whose catch-all route answers
  HTTP 200 with the same 2,364-byte HTML shell for EVERY path, including paths that cannot exist —
  this is a soft-404, not a served document, and it is recorded as a MISS. No WellKnown pointer is
  emitted in apis.yml, because a pointer would assert that WeaveAPI serves a discovery surface it does
  not serve. The one real machine-readable discovery document WeaveAPI does publish is not at a
  /.well-known/ path at all: it is the unauthenticated gateway config at /api/status, saved here as
  weaveapi-gateway-status.json, and the model/price catalog at /api/pricing (see plans/).

hosts:
  - host: https://weaveapi.dev
    kind: marketing + documentation
    catch_all_soft_200: false
  - host: https://api.weaveapi.dev
    kind: API gateway
    catch_all_soft_200: false
  - host: https://console.weaveapi.dev
    kind: hosted console (SPA)
    catch_all_soft_200: true
    soft_200_note: >-
      Returns 200 text/html (2364 bytes, <!doctype html> shell, lang="zh") for every probed path.
      All console rows below are therefore recorded as miss, not hit.

