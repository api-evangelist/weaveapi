# Real machine-readable documents WeaveAPI DOES serve, outside /.well-known/
non_standard_discovery:
  - path: /api/status
    host: api.weaveapi.dev
    status: 200
    content_type: application/json
    file: weaveapi-gateway-status.json
    describes: >-
      Unauthenticated gateway configuration — system name, build version, console address, docs link,
      enabled login methods (password, GitHub OAuth, Google OIDC, passkey), Turnstile site key,
      quota/currency display settings, and the third-party chat clients the console can hand off to.
  - path: /api/pricing
    host: api.weaveapi.dev
    status: 200
    content_type: application/json
    file: ../plans/weaveapi-model-pricing.json
    describes: >-
      Unauthenticated model + price-ratio catalog for all callable model routes. This is the public
      projection of the "Model Marketplace" the docs name as the source of truth.
  - path: /robots.txt
    host: weaveapi.dev
    status: 200
    content_type: text/plain
    file: weaveapi-content-signals.txt
    describes: >-
      Carries Cloudflare-managed Content Signals (search=yes, ai-train=no, use=reference) plus explicit
      Disallow for GPTBot, ClaudeBot, CCBot, Google-Extended, Applebot-Extended, Amazonbot, Bytespider
      and meta-externalagent. See weaveapi-content-signals.yml.
