summary: >-
  WeaveAPI publishes NO first-party client library in any language, and this is a deliberate product
  position rather than an oversight: the entire pitch is "keep your SDK, change the base URL". The docs'
  SDK section says so directly — "OpenAI-compatible SDKs and frameworks usually need only a base URL and
  key change." Consumers install the vendor-neutral OpenAI SDK and point it at api.weaveapi.dev/v1.
  Recorded as zero official packages with the reason, not as an unexplained absence. No SDKs pointer is
  emitted in apis.yml, because WeaveAPI ships no SDK.

